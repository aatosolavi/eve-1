name: Registry submission
description: Submit an eve template or example for inclusion in the registry.
title: "[Registry]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for contributing to the eve registry. Submissions must be public, include setup instructions, and use a supported version of eve.
  - type: input
    id: name
    attributes:
      label: Name
      description: The name that should appear in the registry.
      placeholder: Customer support agent
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Briefly explain what the agent does and who it is for.
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Chat
        - Collaboration
        - Example
        - Other
    validations:
      required: true
  - type: input
    id: integrations
    attributes:
      label: Integrations
      description: List the channels, connections, and APIs used by the agent.
      placeholder: Slack, Linear, and GitHub
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source URL
      description: Link to the public source repository or directory.
      placeholder: https://github.com/owner/repository
    validations:
      required: true
  - type: input
    id: template
    attributes:
      label: Template or demo URL
      description: Link to a deployable template or live demo, if available.
      placeholder: https://vercel.com/templates/...
  - type: checkboxes
    id: checklist
    attributes:
      label: Submission checklist
      options:
        - label: The source is public and includes setup instructions.
          required: true
        - label: I have tested this project with a currently supported version of eve.
          required: true
        - label: I have permission to submit this project and its assets.
          required: true
